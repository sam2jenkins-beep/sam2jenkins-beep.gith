<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Survivor Preparation Handbook</title>
    
    <!-- Tailwind CSS & Chart.js Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&family=Oswald:wght@400;700&family=Roboto:wght@400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet">

    <!-- Configuration (MUST REMAIN INLINE) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-pink': '#FF69B4',
                        'zinc-950': '#09090b',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        roboto: ['Roboto', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],
                        georgia: ['Georgia', 'serif'],
                    },
                    letterSpacing: {
                        'super-wide': '0.2em',
                    },
                    animation: {
                        'spin-slow': 'spin 20s linear infinite',
                        'spin-reverse': 'spin 15s linear infinite reverse',
                    }
                }
            }
        }
    </script>

    <!-- Custom Stylesheet Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection-pink">

    <!-- MAIN SCROLL VIEW -->
    <div id="main-view">
        
        <!-- 1. HERO SECTION -->
        <section id="hero" class="bg-black">
            <div class="z-10 flex flex-col items-center text-center space-y-8 max-w-5xl">
                <h1 class="text-4xl md:text-6xl lg:text-8xl font-black tracking-tighter text-white uppercase leading-[0.9] font-oswald">
                    SURVIVOR PREP <span class="text-neon-pink block md:inline">NOTEBOOKLM</span>
                </h1>
                
                <div class="w-full h-px bg-gradient-to-r from-transparent via-neon-pink to-transparent opacity-50 my-4"></div>
                
                <div class="relative group mt-8 cursor-pointer">
                    <!-- Glow Effect -->
                    <div class="absolute -inset-2 bg-gradient-to-r from-neon-pink to-purple-600 rounded-xl blur-md opacity-25 group-hover:opacity-75 transition duration-1000 group-hover:duration-200"></div>
                    
                    <!-- Landscape Image Container -->
                    <div class="relative w-96 h-64 md:w-[600px] md:h-[400px] rounded-xl border-4 border-white bg-black overflow-hidden shadow-[0_0_20px_rgba(255,105,180,0.3)]">
                        <!-- 
                            YOUR PHOTO CONFIGURATION
                        -->
                        <img 
                            id="hero-image"
                            src="https://placehold.co/800x533/18181b/FF69B4?text=Tactical+Preparation" 
                            onerror="this.src='https://placehold.co/800x533/000000/FF69B4?text=Add+Landscape+Photo'"
                            alt="Main Player" 
                            class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-500 grayscale group-hover:grayscale-0"
                        >
                    </div>
                </div>
                
                <div class="absolute bottom-10 animate-bounce">
                    <span class="text-neon-pink text-sm tracking-widest uppercase">Scroll to Begin</span>
                </div>
            </div>
        </section>

        <!-- 2. TIMELINE SECTION -->
        <section id="timeline" class="bg-zinc-950 border-t border-zinc-900">
            <div class="flex flex-col w-full h-full justify-center">
                <h2 class="text-4xl font-bold text-white mb-12 uppercase tracking-wider px-4 md:px-0 font-oswald border-l-4 border-neon-pink pl-4 ml-4 md:ml-0">
                    The <span class="text-neon-pink">Journey</span>
                </h2>
                
                <div id="timeline-container" class="w-full flex overflow-x-auto snap-x snap-mandatory no-scrollbar pb-12 items-center cursor-grab active:cursor-grabbing">
                    <div class="flex space-x-12 px-[10vw] md:px-[25vw]" id="timeline-content">
                        <!-- Timeline items injected by JS -->
                    </div>
                </div>
                
                <div class="text-center mt-8 opacity-50 text-sm">
                    <span class="md:hidden">Swipe Left</span>
                    <span class="hidden md:inline">Scroll Horizontally</span>
                </div>
            </div>
        </section>

        <!-- 3. CONTENT HUBS -->
        <section id="content-hubs" class="bg-black">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl h-full md:h-[70vh]">
                <!-- Card 1 -->
                <button onclick="openTopic('pregame')" class="relative group block w-full h-full border border-zinc-800 hover:border-neon-pink transition-colors duration-500 overflow-hidden bg-zinc-950 text-left focus:outline-none rounded-xl">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                    
                    <div class="relative h-full flex flex-col justify-end p-8 md:p-12 group-hover:translate-y-[-10px] transition-transform duration-500">
                        <h3 class="text-4xl md:text-5xl lg:text-6xl font-black uppercase leading-tight text-white group-hover:text-neon-pink transition-colors font-oswald">
                            Pregame <br/> Guidelines
                        </h3>
                        <div class="h-1 w-12 bg-neon-pink mt-6 group-hover:w-full transition-all duration-700"></div>
                        <p class="mt-4 text-zinc-400 text-sm tracking-widest uppercase group-hover:text-white">
                            Historical Analysis & Strategy
                        </p>
                    </div>
                </button>

                <!-- NEW Card 2: Survivor NotebookLM -->
                <button onclick="openTopic('survivornotebook')" class="relative group block w-full h-full border border-zinc-800 hover:border-neon-pink transition-colors duration-500 overflow-hidden bg-zinc-950 text-left focus:outline-none rounded-xl">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-5"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                    
                    <div class="relative h-full flex flex-col justify-end p-8 md:p-12 group-hover:translate-y-[-10px] transition-transform duration-500">
                        <h3 class="text-4xl md:text-5xl lg:text-6xl font-black uppercase leading-tight text-white group-hover:text-neon-pink transition-colors font-oswald">
                            Survivor <br/> NotebookLM
                        </h3>
                        <div class="h-1 w-12 bg-neon-pink mt-6 group-hover:w-full transition-all duration-700"></div>
                        <p class="mt-4 text-zinc-400 text-sm tracking-widest uppercase group-hover:text-white">
                            AI-Powered Research & Note Taking
                        </p>
                    </div>
                </button>

                <!-- Card 3 (Original Card 2) -->
                <button onclick="openTopic('meta')" class="relative group block w-full h-full border border-zinc-800 hover:border-neon-pink transition-colors duration-500 overflow-hidden bg-zinc-950 text-left focus:outline-none rounded-xl">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-80"></div>
                    
                    <div class="relative h-full flex flex-col justify-end p-8 md:p-12 group-hover:translate-y-[-10px] transition-transform duration-500">
                        <h3 class="text-4xl md:text-5xl lg:text-6xl font-black uppercase leading-tight text-white group-hover:text-neon-pink transition-colors font-oswald">
                            META <br/> GAME
                        </h3>
                        <div class="h-1 w-12 bg-neon-pink mt-6 group-hover:w-full transition-all duration-700"></div>
                        <p class="mt-4 text-zinc-400 text-sm tracking-widest uppercase group-hover:text-white">
                            Social Dynamics & Psychology
                        </p>
                    </div>
                </button>
            </div>
        </section>

        <!-- 4. CORE TRIANGLE -->
        <section id="core-triangle" class="bg-zinc-950">
            <div class="relative w-full max-w-5xl h-full flex flex-col justify-center">
                <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
                    <svg viewBox="0 0 100 100" class="w-full h-full max-w-[80vh] max-h-[80vh] fill-none stroke-white stroke-1">
                        <!-- The Triangle -->
                        <polygon points="50,10 5,90 95,90" />
                        <!-- Outwit label near top left -->
                        <text x="5" y="5" font-size="5" fill="#FF69B4" class="font-oswald uppercase tracking-widest">Outwit</text>
                        <!-- Outplay label near top right -->
                        <text x="95" y="5" font-size="5" fill="#FF69B4" text-anchor="end" class="font-oswald uppercase tracking-widest">Outplay</text>
                        <!-- Outlast label near bottom center -->
                        <text x="50" y="98" font-size="5" fill="#FF69B4" text-anchor="middle" class="font-oswald uppercase tracking-widest">Outlast</text>
                    </svg>
                </div>

                <!-- Top Row -->
                <div class="flex flex-col md:flex-row justify-between items-center w-full flex-1 md:items-start pt-12 md:px-12 z-10">
                    <button onclick="openTopic('outwit')" class="group cursor-pointer mb-12 md:mb-0 text-center md:text-left focus:outline-none">
                        <h2 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-zinc-500 group-hover:from-neon-pink group-hover:to-pink-600 transition-all duration-300 uppercase tracking-tighter font-oswald">
                            Outwit
                        </h2>
                        <p class="opacity-0 group-hover:opacity-100 transition-opacity text-neon-pink tracking-widest uppercase text-xs mt-2">
                            The Social Game
                        </p>
                    </button>

                    <button onclick="openTopic('outplay')" class="group cursor-pointer text-center md:text-right focus:outline-none">
                        <h2 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-zinc-500 group-hover:from-neon-pink group-hover:to-pink-600 transition-all duration-300 uppercase tracking-tighter font-oswald">
                            Outplay
                        </h2>
                        <p class="opacity-0 group-hover:opacity-100 transition-opacity text-neon-pink tracking-widest uppercase text-xs mt-2">
                            The Physical Game
                        </p>
                    </button>
                </div>

                <!-- Bottom Row -->
                <div class="flex justify-center items-end flex-1 pb-12 z-10">
                    <button onclick="openTopic('outlast')" class="group cursor-pointer text-center focus:outline-none">
                        <h2 class="text-7xl md:text-9xl font-black text-white group-hover:text-neon-pink transition-colors duration-300 uppercase tracking-tighter transform group-hover:scale-110 transition-transform font-oswald">
                            Outlast
                        </h2>
                        <p class="opacity-0 group-hover:opacity-100 transition-opacity text-neon-pink tracking-widest uppercase text-sm mt-4">
                            The Endurance Game
                        </p>
                    </button>
                </div>
            </div>
        </section>

        <!-- 5. END GAME -->
        <section id="end-game" class="bg-black border-y border-neon-pink/20">
            <div class="relative z-10 mix-blend-difference">
                <button onclick="openTopic('endgame')" class="text-[15vw] leading-none font-black text-white uppercase tracking-tighter text-center hover:text-neon-pink transition-colors duration-700 cursor-pointer select-none focus:outline-none font-oswald">
                    End<br/>Game
                </button>
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                <div class="w-[50vw] h-[50vw] border rounded-full border-zinc-800 animate-[spin_20s_linear_infinite]"></div>
                <div class="absolute w-[40vw] h-[40vw] border rounded-full border-zinc-700 animate-[spin_15s_linear_infinite_reverse]"></div>
                <div class="absolute w-[30vw] h-[30vw] border rounded-full border-zinc-600 animate-[spin_10s_linear_infinite]"></div>
            </div>
        </section>

        <!-- 6. PORTFOLIOS -->
        <section id="portfolios" class="bg-zinc-950">
            <div class="w-full max-w-7xl flex flex-col h-full py-12">
                <div class="flex justify-between items-end mb-12 border-b border-zinc-800 pb-6 shrink-0">
                    <h2 class="text-4xl md:text-6xl font-bold uppercase tracking-tighter text-white font-oswald">
                        Player <span class="text-neon-pink">Portfolios</span>
                    </h2>
                    <span class="text-zinc-500 text-sm uppercase tracking-widest hidden md:block">Classified Data</span>
                </div>

                <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 overflow-y-auto pb-12 no-scrollbar">
                    <!-- Portfolio items injected by JS -->
                </div>
                
                <footer class="mt-auto text-center text-zinc-600 text-xs uppercase tracking-widest py-4 shrink-0">
                    &copy; Survivor Prep Resource 2024
                </footer>
            </div>
        </section>
    </div>

    <!-- TOPIC DETAIL VIEW (Overlay) -->
    <div id="topic-view">
        <div class="min-h-screen w-full bg-black text-white p-6 md:p-12">
            <!-- Header -->
            <header class="flex justify-between items-center mb-12 md:mb-24 sticky top-0 bg-black/90 backdrop-blur-sm py-4 z-50 border-b border-zinc-900">
                <button onclick="closeTopic()" class="group flex items-center space-x-2 text-sm uppercase tracking-widest text-zinc-400 hover:text-neon-pink transition-colors focus:outline-none">
                    <span class="block w-8 h-px bg-zinc-600 group-hover:bg-neon-pink transition-colors"></span>
                    <span>Back to Handbook</span>
                </button>
                <div id="topic-header-id" class="text-neon-pink font-black text-xl tracking-tighter font-oswald">SPR // TOPIC</div>
            </header>

            <!-- Title Section -->
            <section id="topic-hero" class="mb-24 border-b border-zinc-800 pb-12 h-auto block !p-0">
                <h1 id="topic-title" class="text-5xl md:text-8xl font-black uppercase tracking-tighter leading-none mb-6 text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-500 font-oswald">
                    TITLE
                </h1>
                <p id="topic-subtitle" class="text-xl md:text-2xl text-zinc-400 max-w-3xl font-light leading-relaxed">
                    Subtitle
                </p>
            </section>

            <!-- Sub-topics Grid -->
            <div id="subtopics-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-24">
                <!-- Injected by JS -->
            </div>

            <!-- Special Footer Area (Injected by JS for End Game Video) -->
            <div id="topic-special-footer" class="mb-24 hidden">
                <!-- Video injects here -->
            </div>

            <!-- Footer -->
            <div class="mt-auto pt-12 border-t border-zinc-900 text-center">
                <button onclick="closeTopic()" class="text-zinc-600 hover:text-white uppercase tracking-widest text-xs transition-colors py-4 px-8 border border-zinc-900 hover:border-zinc-700 focus:outline-none rounded-lg">
                    Return to Main View
                </button>
            </div>
        </div>
    </div>

    <!-- CUSTOM VIEWS (All hidden by default) -->
    <div id="notebook-lm-view"></div>
    <div id="advantages-view"></div>
    <div id="preparation-view"></div>
    <div id="meta-prep-view"></div>
    <div id="reality-tv-view"></div>
    <div id="volatility-matrix-view"></div>
    <div id="renaissance-view"></div>
    <div id="jury-view"></div>
    <div id="panama-view"></div>
    <div id="city-girl-view"></div>
    <div id="day1-view"></div>
    <div id="ftc-view"></div>
    <div id="suggestions-view"></div> 
    <div id="swimming-view"></div> <!-- NEW VIEW PLACEHOLDER -->
    <!-- END CUSTOM VIEWS -->

    <!-- Application Logic Link -->
    <script src="script.js"></script>

</body>
</html>
